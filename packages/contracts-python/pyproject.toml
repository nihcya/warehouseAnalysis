[project]
name = "contracts-python"
version = "0.1.0"
description = "仓库品类分析决策工具：引擎与工作台共享的数据契约（Pydantic 模型）"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]
