[project]
name = "warehouse-engine"
version = "0.2.0"
description = "仓库品类分析引擎：校验、KPI/ABC/库龄/补货/预测/基准计算（M1：KPI/COGS 实装）"
requires-python = ">=3.11,<3.12"
dependencies = [
    "contracts-python",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "statsmodels>=0.14,<0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse_engine"]
