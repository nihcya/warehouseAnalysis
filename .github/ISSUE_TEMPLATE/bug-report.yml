name: 缺陷报告
description: 报告一个 bug（CI 红、测试失败、行为异常等）
title: "[bug] "
body:
  - type: dropdown
    id: owner
    attributes:
      label: 疑似责任方
      options: [side-A, side-B, 不确定]
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: 里程碑
      options: [M0, M1, M2, M3, M4, M5, M6, M7, M8]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境/日志