name: Engine CI

# 开发者 B（引擎侧）CI：测试、静态检查与契约 Schema 一致性门禁
on: [push, pull_request]

jobs:
  engine:
    name: warehouse-engine (B)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv (Python 3.11)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync workspace dependencies
        run: uv sync --all-packages --group dev

      # PySide6 在 Linux 上需要的 Qt 运行库（ubuntu runner 未全部预装）：
      # A 侧工作台测试已纳入全量 pytest，需可无头加载 PySide6
      - name: Install Qt system libraries (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Run tests
        env:
          # PySide6 无头运行（A 侧 workbench-desktop 的 UI 测试）
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest

      - name: Lint (ruff)
        run: uv run ruff check packages scripts

      - name: Type check (mypy)
        run: uv run mypy packages/warehouse-engine/src packages/contracts-python/src

      - name: Re-export contract schemas
        run: uv run python scripts/export_schemas.py

      - name: Schema drift gate
        run: git diff --exit-code packages/contracts-schema
