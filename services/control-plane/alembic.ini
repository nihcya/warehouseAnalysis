# 云端控制库 Alembic 配置（服务根：services/control-plane）
# 连接串不写死在这里：由 alembic/env.py 按优先级读取
# （-x database_url > sqlalchemy.url（测试 set_main_option） > 环境变量 DATABASE_URL / app.settings 默认值）
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
# 留空：env.py 负责解析实际连接串
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
