[project]
name = "control-plane"
version = "0.1.0"
description = "云端控制平面：FastAPI /api/v1、认证、设备、配置、任务、同步与日志（开发者 A）"
requires-python = ">=3.11,<3.12"
dependencies = [
    "contracts-python",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # M2 认证：密码哈希（SECURITY.md 冻结 Argon2id）与 Access Token（JWT）
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    # M3 同步信封：Fernet 对称加密（云端加密、工作台解密，密钥经环境变量注入）
    "cryptography>=43.0",
]

# 服务型成员：不构建为可分发包，仅解析依赖（按主基线 §20.3 以 uvicorn 运行）
[tool.uv]
package = false

[tool.uv.sources]
contracts-python = { workspace = true }
