services:
  postgres:
    image: postgres:17-alpine
    container_name: warehouse-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse_control
    ports:
      - "5432:5432"
    volumes:
      - warehouse-pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warehouse_control"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  warehouse-pgdata-dev:
