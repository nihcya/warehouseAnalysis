# local-data Alembic configuration (local SQLite database).
# NOTE: keep this file ASCII-only: alembic reads it with the system locale encoding.
#
# Usage (run inside local-data/):
#   alembic upgrade head                                  # upgrade to latest
#   alembic downgrade base                                # rollback all
#   alembic -x data_dir=D:\path\to\data upgrade head      # explicit data dir
#   alembic -x url=sqlite:///D:\path\to\warehouse.db upgrade head
#
# sqlalchemy.url is intentionally empty; env.py resolves it with priority:
#   -x url / -x data_dir > configured sqlalchemy.url > WORKBENCH_DATA_DIR > %LOCALAPPDATA%

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url =
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
