[project]
name = "local-data"
version = "0.1.0"
description = "本地业务数据库：SQLite ORM、Alembic 迁移、Repository 与事务边界（开发者 A）"
requires-python = ">=3.11,<3.12"
dependencies = [
    "contracts-python",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_data"]

[tool.uv.sources]
contracts-python = { workspace = true }
